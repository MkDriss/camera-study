server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Participant links carry their code (?code=...). An access log would store it
    # next to their IP address, which links a person to their answers: keep it off.
    access_log off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is always re-fetched, so participants get the latest version
    # after you rebuild. The JS/CSS files have hashed names and can be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
